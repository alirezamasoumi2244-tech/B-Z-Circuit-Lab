[package]
name="b-z-circuit-lab"
version="0.3.0"
edition="2021"
[lib]
name="bz_circuit_lab_lib"
crate-type=["staticlib","cdylib","rlib"]
[build-dependencies]
tauri-build={version="2"}
[dependencies]
tauri={version="2"}
serde={version="1",features=["derive"]}
serde_json="1"
rusqlite={version="0.32",features=["bundled"]}